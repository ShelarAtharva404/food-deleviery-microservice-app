apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
      - name: review-service
        image: yourusername/food-delivery-review-service:v1.0  # CHANGE THIS
        ports:
        - containerPort: 4008
        env:
        - name: PORT
          value: "4008"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DATABASE_URL_REVIEW
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 4008
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4008
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: food-delivery
spec:
  type: ClusterIP
  ports:
  - port: 4008
    targetPort: 4008
  selector:
    app: review-service
