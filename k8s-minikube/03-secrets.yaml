apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: food-delivery
type: Opaque
stringData:
  # Database password
  DB_PASSWORD: "postgres"
  
  # JWT Secret (CHANGE THIS IN PRODUCTION!)
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production-min-32-chars"
  
  # Database connection strings
  DATABASE_URL_USER: "postgresql://postgres:postgres@postgres-service:5432/userdb"
  DATABASE_URL_RESTAURANT: "postgresql://postgres:postgres@postgres-service:5432/restaurantdb"
  DATABASE_URL_ORDER: "postgresql://postgres:postgres@postgres-service:5432/orderdb"
  DATABASE_URL_DELIVERY: "postgresql://postgres:postgres@postgres-service:5432/deliverydb"
  DATABASE_URL_PAYMENT: "postgresql://postgres:postgres@postgres-service:5432/paymentdb"
  DATABASE_URL_REVIEW: "postgresql://postgres:postgres@postgres-service:5432/reviewdb"
  DATABASE_URL_COUPON: "postgresql://postgres:postgres@postgres-service:5432/coupondb"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: food-delivery
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_USER: "postgres"
