apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: yourusername/food-delivery-notification-service:v1.0  # CHANGE THIS
        ports:
        - containerPort: 4006
        env:
        - name: PORT
          value: "4006"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 4006
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4006
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: food-delivery
spec:
  type: ClusterIP
  ports:
  - port: 4006
    targetPort: 4006
  selector:
    app: notification-service
